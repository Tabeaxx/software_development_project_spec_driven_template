<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="dashboard" aria-labelledby="dashboard-title">
    <header class="dashboard__header">
      <p class="eyebrow">Overview</p>
      <h1 id="dashboard-title">Dashboard</h1>
      <p class="dashboard__intro">A simple starting point for the application.</p>
    </header>

    <section class="status-panel" aria-labelledby="status-title">
      <h2 id="status-title">Application status</h2>
      <p id="status-message">Ready to get started.</p>
      <button id="status-button" type="button">Check status</button>
    </section>
  </main>
</body>
</html>
